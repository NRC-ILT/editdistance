[build-system]
requires = ["pdm-backend", "cython"]
build-backend = "pdm.backend"


[project]
name = "ilt-editdistance"
version = "0.8.3"
description = "Fast implementation of the edit distance (Levenshtein distance)"
authors = [
    {name = "Hiroyuki Tanaka", email = "aflc0x@gmail.com"},
]
maintainers = [
    {name = "Eric Joanis", email = "Eric.Joanis@nrc-cnrc.gc.ca"},
]
dependencies = []
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"

[project.urls]
Repository = "https://github.com/nrc-ilt/editdistance"

[tool.pdm]
distribution = true

[tool.pdm.build]
run-setuptools = true

[tool.pdm.dev-dependencies]
dev = [
    "cython>=3.0",
]
